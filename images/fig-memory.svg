ld' >70B</text><text x='400' y='502' text-anchor='middle' font-size='26' fill='#7a7a8c' font-weight='normal' >16-bit</text><text x='600' y='502' text-anchor='middle' font-size='34' fill='#363644' font-weight='bold' >≈ 140 GB</text><text x='1100' y='502' text-anchor='middle' font-size='24' fill='#363644' font-weight='normal' >a server, or Fox</text>
