<text x='800' y='70' text-anchor='middle' font-size='40' fill='#1a202c' font-weight='bold' >parameters × bytes per parameter ≈ memory</text><rect x='80' y='150' width='1440' height='80' rx='14' fill='white' stroke='#2f855a' stroke-width='3'/><text x='200' y='202' text-anchor='middle' font-size='34' fill='#2f855a' font-weight='bold' >7–8B</text><text x='400' y='202' text-anchor='middle' font-size='26' fill='#718096' font-weight='normal' >4-bit</text><text x='600' y='202' text-anchor='middle' font-size='34' fill='#1a202c' font-weight='bold' >≈ 5 GB</text><text x='1100' y='202' text-anchor='middle' font-size='24' fill='#1a202c' font-weight='normal' >any recent laptop or phone</text><rect x='80' y='250' width='1440' height='80' rx='14' fill='white' stroke='#2b6cb0' stroke-width='3'/><text x='200' y='302' text-anchor='middle' font-size='34' fill='#2b6cb0' font-weight='bold' >30B</text><text x='400' y='302' text-anchor='middle' font-size='26' fill='#718096' font-weight='normal' >4-bit</text><text x='600' y='302' text-anchor='middle' font-size='34' fill='#1a202c' font-weight='bold' >≈ 20 GB</text><text x='1100' y='302' text-anchor='middle' font-size='24' fill='#1a202c' font-weight='normal' >laptop with 32 GB unified, or a 24 GB GPU</text><rect x='80' y='350' width='1440' height='80' rx='14' fill='white' stroke='#553c9a' stroke-width='3'/><text x='200' y='402' text-anchor='middle' font-size='34' fill='#553c9a' font-weight='bold' >70B</text><text x='400' y='402' text-anchor='middle' font-size='26' fill='#718096' font-weight='normal' >4-bit</text><text x='600' y='402' text-anchor='middle' font-size='34' fill='#1a202c' font-weight='bold' >≈ 40 GB</text><text x='1100' y='402' text-anchor='middle' font-size='24' fill='#1a202c' font-weight='normal' >large unified memory, or two big GPUs</text><rect x='80' y='450' width='1440' height='80' rx='14' fill='white' stroke='#c53030' stroke-width='3'/><text x='200' y='502' text-anchor='middle' font-size='34' fill='#c53030' font-weight='bold' >70B</text><text x='400' y='502' text-anchor='middle' font-size='26' fill='#718096' font-weight='normal' >16-bit</text><text x='600' y='502' text-anchor='middle' font-size='34' fill='#1a202c' font-weight='bold' >≈ 140 GB</text><text x='1100' y='502' text-anchor='middle' font-size='24' fill='#1a202c' font-weight='normal' >a server, or Fox</text>
