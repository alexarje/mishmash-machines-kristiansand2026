<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 440' font-family='Inter, Helvetica Neue, Helvetica, Arial, sans-serif'>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2b6cb0'/></marker></defs>
<text x='800' y='60' text-anchor='middle' font-size='34' fill='#1a202c' font-weight='bold' >WP1 · A musician on stage</text><rect x='60' y='110' width='460' height='280' rx='14' fill='white' stroke='#cbd5e0' stroke-width='3'/><text x='290' y='150' text-anchor='middle' font-size='18' fill='#718096' font-weight='normal' >prototype small and local</text><text x='290' y='200' text-anchor='middle' font-size='28' fill='#1a202c' font-weight='bold' >Record</text><text x='290' y='245.0' text-anchor='middle' font-size='20' fill='#1a202c' font-weight='normal' >own material,</text><text x='290' y='271.0' text-anchor='middle' font-size='20' fill='#1a202c' font-weight='normal' >a few hours of audio,</text><text x='290' y='297.0' text-anchor='middle' font-size='20' fill='#1a202c' font-weight='normal' >on the laptop</text><line x1='530' y1='250' x2='575' y2='250' stroke='#2b6cb0' stroke-width='4' marker-end='url(#a)'/><rect x='580' y='110' width='460' height='280' rx='14' fill='#ebf4ff' stroke='#2b6cb0' stroke-width='3'/><text x='810' y='150' text-anchor='middle' font-size='18' fill='#718096' font-weight='normal' >scale up only for training</text><text x='810' y='200' text-anchor='middle' font-size='28' fill='#1a202c' font-weight='bold' >Train RAVE</text><text x='810' y='245.0' text-anchor='middle' font-size='20' fill='#1a202c' font-weight='normal' >overnight on a studio GPU</text><text x='810' y='271.0' text-anchor='middle' font-size='20' fill='#1a202c' font-weight='normal' >or a Fox job;</text><text x='810' y='297.0' text-anchor='middle' font-size='20' fill='#1a202c' font-weight='normal' >the model is ~30 MB</text><line x1='1050' y1='250' x2='1095' y2='250' stroke='#2b6cb0' stroke-width='4' marker-end='url(#a)'/><rect x='1100' y='110' width='460' height='280' rx='14' fill='white' stroke='#cbd5e0' stroke-width='3'/><text x='1330' y='150' text-anchor='middle' font-size='18' fill='#718096' font-weight='normal' >bring it back to the room</text><text x='1330' y='200' text-anchor='middle' font-size='28' fill='#1a202c' font-weight='bold' >Play</text><text x='1330' y='245.0' text-anchor='middle' font-size='20' fill='#1a202c' font-weight='normal' >nn~ in Max on the laptop,</text><text x='1330' y='271.0' text-anchor='middle' font-size='20' fill='#1a202c' font-weight='normal' >milliseconds of latency,</text><text x='1330' y='297.0' text-anchor='middle' font-size='20' fill='#1a202c' font-weight='normal' >nothing leaves the studio</text>
</svg>
