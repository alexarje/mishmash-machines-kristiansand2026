<text x='800' y='60' text-anchor='middle' font-size='34' fill='#1a202c' font-weight='bold' >WP4 · A teacher in a school</text><rect x='60' y='110' width='460' height='280' rx='14' fill='white' stroke='#cbd5e0' stroke-width='3'/><text x='290' y='150' text-anchor='middle' font-size='18' fill='#718096' font-weight='normal' >prototype small and local</text><text x='290' y='200' text-anchor='middle' font-size='28' fill='#1a202c' font-weight='bold' >Browser only</text><text x='290' y='245.0' text-anchor='middle' font-size='20' fill='#1a202c' font-weight='normal' >Chromebooks, Feide,</text><text x='290' y='271.0' text-anchor='middle' font-size='20' fill='#1a202c' font-weight='normal' >no GPU, pupils' data;</text><text x='290' y='297.0' text-anchor='middle' font-size='20' fill='#1a202c' font-weight='normal' >institution-hosted chat</text><line x1='530' y1='250' x2='575' y2='250' stroke='#2b6cb0' stroke-width='4' marker-end='url(#a)'/><rect x='580' y='110' width='460' height='280' rx='14' fill='#ebf4ff' stroke='#2b6cb0' stroke-width='3'/><text x='810' y='150' text-anchor='middle' font-size='18' fill='#718096' font-weight='normal' >scale up only for training</text><text x='810' y='200' text-anchor='middle' font-size='28' fill='#1a202c' font-weight='bold' >Offline where it matters</text><text x='810' y='245.0' text-anchor='middle' font-size='20' fill='#1a202c' font-weight='normal' >Whisper on the teacher's</text><text x='810' y='271.0' text-anchor='middle' font-size='20' fill='#1a202c' font-weight='normal' >laptop for transcripts;</text><text x='810' y='297.0' text-anchor='middle' font-size='20' fill='#1a202c' font-weight='normal' >nothing uploaded</text><line x1='1050' y1='250' x2='1095' y2='250' stroke='#2b6cb0' stroke-width='4' marker-end='url(#a)'/><rect x='1100' y='110' width='460' height='280' rx='14' fill='white' stroke='#cbd5e0' stroke-width='3'/><text x='1330' y='150' text-anchor='middle' font-size='18' fill='#718096' font-weight='normal' >bring it back to the room</text><text x='1330' y='200' text-anchor='middle' font-size='28' fill='#1a202c' font-weight='bold' >In the classroom</text><text x='1330' y='245.0' text-anchor='middle' font-size='20' fill='#1a202c' font-weight='normal' >free, Norwegian, GDPR-safe</text><text x='1330' y='271.0' text-anchor='middle' font-size='20' fill='#1a202c' font-weight='normal' >creative tools; the scarcest</text><text x='1330' y='297.0' text-anchor='middle' font-size='20' fill='#1a202c' font-weight='normal' >resource in the whole map</text>
