<text x='800' y='60' text-anchor='middle' font-size='34' fill='#363644' font-weight='bold' >WP2 · A filmmaker</text><rect x='60' y='110' width='460' height='280' rx='14' fill='white' stroke='#d6d6e0' stroke-width='3'/><text x='290' y='150' text-anchor='middle' font-size='18' fill='#7a7a8c' font-weight='normal' >prototype small and local</text><text x='290' y='200' text-anchor='middle' font-size='28' fill='#363644' font-weight='bold' >Sketch</text><text x='290' y='245.0' text-anchor='middle' font-size='20' fill='#363644' font-weight='normal' >storyboards with an open</text><text x='290' y='271.0' text-anchor='middle' font-size='20' fill='#363644' font-weight='normal' >image model (FLUX, SDXL)</text><text x='290' y='297.0' text-anchor='middle' font-size='20' fill='#363644' font-weight='normal' >on a laptop with GPU</text><line x1='530' y1='250' x2='575' y2='250' stroke='#A7A1F4' stroke-width='4' marker-end='url(#a)'/><rect x='580' y='110' width='460' height='280' rx='14' fill='#eeedfc' stroke='#A7A1F4' stroke-width='3'/><text x='810' y='150' text-anchor='middle' font-size='18' fill='#7a7a8c' font-weight='normal' >scale up only for training</text><text x='810' y='200' text-anchor='middle' font-size='28' fill='#363644' font-weight='bold' >Generate</text><text x='810' y='245.0' text-anchor='middle' font-size='20' fill='#363644' font-weight='normal' >open video models (Wan, LTX)</text><text x='810' y='271.0' text-anchor='middle' font-size='20' fill='#363644' font-weight='normal' >on a workstation or</text><text x='810' y='297.0' text-anchor='middle' font-size='20' fill='#363644' font-weight='normal' >an EU-hosted provider</text><line x1='1050' y1='250' x2='1095' y2='250' stroke='#A7A1F4' stroke-width='4' marker-end='url(#a)'/><rect x='1100' y='110' width='460' height='280' rx='14' fill='white' stroke='#d6d6e0' stroke-width='3'/><text x='1330' y='150' text-anchor='middle' font-size='18' fill='#7a7a8c' font-weight='normal' >bring it back to the room</text><text x='1330' y='200' text-anchor='middle' font-size='28' fill='#363644' font-weight='bold' >Cut</text><text x='1330' y='245.0' text-anchor='middle' font-size='20' fill='#363644' font-weight='normal' >into the edit; provenance</text><text x='1330' y='271.0' text-anchor='middle' font-size='20' fill='#363644' font-weight='normal' >and licence of every model</text><text x='1330' y='297.0' text-anchor='middle' font-size='20' fill='#363644' font-weight='normal' >documented for rights</text>
