<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 440' font-family='Inter, Helvetica Neue, Helvetica, Arial, sans-serif'>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#A7A1F4'/></marker></defs>
<text x='800' y='60' text-anchor='middle' font-size='34' fill='#363644' font-weight='bold' >WP6 · The National Library</text><rect x='60' y='110' width='460' height='280' rx='14' fill='white' stroke='#d6d6e0' stroke-width='3'/><text x='290' y='150' text-anchor='middle' font-size='18' fill='#7a7a8c' font-weight='normal' >prototype small and local</text><text x='290' y='200' text-anchor='middle' font-size='28' fill='#363644' font-weight='bold' >Prepare</text><text x='290' y='245.0' text-anchor='middle' font-size='20' fill='#363644' font-weight='normal' >petabytes of text, audio,</text><text x='290' y='271.0' text-anchor='middle' font-size='20' fill='#363644' font-weight='normal' >images, film; copyright</text><text x='290' y='297.0' text-anchor='middle' font-size='20' fill='#363644' font-weight='normal' >and public-sector duty</text><line x1='530' y1='250' x2='575' y2='250' stroke='#A7A1F4' stroke-width='4' marker-end='url(#a)'/><rect x='580' y='110' width='460' height='280' rx='14' fill='#eeedfc' stroke='#A7A1F4' stroke-width='3'/><text x='810' y='150' text-anchor='middle' font-size='18' fill='#7a7a8c' font-weight='normal' >scale up only for training</text><text x='810' y='200' text-anchor='middle' font-size='28' fill='#363644' font-weight='bold' >Train</text><text x='810' y='245.0' text-anchor='middle' font-size='20' fill='#363644' font-weight='normal' >multimodal Norwegian model</text><text x='810' y='271.0' text-anchor='middle' font-size='20' fill='#363644' font-weight='normal' >on Olivia or LUMI,</text><text x='810' y='297.0' text-anchor='middle' font-size='20' fill='#363644' font-weight='normal' >months of allocation</text><line x1='1050' y1='250' x2='1095' y2='250' stroke='#A7A1F4' stroke-width='4' marker-end='url(#a)'/><rect x='1100' y='110' width='460' height='280' rx='14' fill='white' stroke='#d6d6e0' stroke-width='3'/><text x='1330' y='150' text-anchor='middle' font-size='18' fill='#7a7a8c' font-weight='normal' >bring it back to the room</text><text x='1330' y='200' text-anchor='middle' font-size='28' fill='#363644' font-weight='bold' >Release</text><text x='1330' y='245.0' text-anchor='middle' font-size='20' fill='#363644' font-weight='normal' >open weights on Hugging Face;</text><text x='1330' y='271.0' text-anchor='middle' font-size='20' fill='#363644' font-weight='normal' >the musician in WP1</text><text x='1330' y='297.0' text-anchor='middle' font-size='20' fill='#363644' font-weight='normal' >downloads them</text>
